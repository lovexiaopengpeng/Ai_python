services:
  - type: web
    name: user-auth-service
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: user-db
          property: connectionString
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: 0
databases:
  - name: user-db
    databaseName: userdb
    user: admin
    plan: starter
